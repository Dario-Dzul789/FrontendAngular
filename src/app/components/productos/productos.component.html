<div class="container-productos">
    <h2 class="titulo">Gestión de Productos</h2>
  
    <form (ngSubmit)="guardarProducto()" class="formulario">
      <div class="fila-form">
        <div class="campo">
          <input type="text" class="input" [(ngModel)]="producto.codigo"
                 name="codigo" placeholder="Código" required />
        </div>
        <div class="campo">
          <input type="text" class="input" [(ngModel)]="producto.nombre"
                 name="nombre" placeholder="Nombre" required />
        </div>
        <div class="campo">
          <input type="number" class="input" [(ngModel)]="producto.precio"
                 name="precio" placeholder="Precio" required />
        </div>
        <div class="campo">
          <input type="number" class="input" [(ngModel)]="producto.existencia"
                 name="existencia" placeholder="Existencia" required />
        </div>
      </div>
  
      <div class="botones-form">
        <button type="submit" class="btn btn-primario">
          {{ editando ? 'Actualizar' : 'Agregar' }}
        </button>
        <button type="button" class="btn btn-secundario" *ngIf="editando"
                (click)="resetFormulario()">Cancelar</button>
        <button type="button" class="btn btn-aviso" (click)="crearPDF()">
          Descargar PDF
        </button>
      </div>
    </form>
  
    <div class="tabla-scroll">
      <table class="tabla">
        <thead>
          <tr>
            <th class="oculto">#</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Existencia</th>
            <th class="centro">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of productos; let i = index">
            <td class="oculto">{{ u.id }}</td>
            <td>{{ u.codigo }}</td>
            <td>{{ u.nombre }}</td>
            <td>{{ u.precio }}</td>
            <td>{{ u.existencia }}</td>
            <td class="centro">
              <button class="btn btn-aviso btn-sm" (click)="editar(u)">Editar</button>
              <button class="btn btn-peligro btn-sm" (click)="eliminar(u.id!)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

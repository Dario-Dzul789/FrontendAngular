<!-- Componente.html -->
<div class="container mt-5">
  <h2 class="mb-4 text-center">Gestión de Usuarios</h2>

  <form (ngSubmit)="guardarUsuario()" class="card p-4 shadow-sm mb-4">
    <div class="form-grid">

      <div class="form-field">
        <input type="text" class="form-control"
               [(ngModel)]="usuario.nombre" name="nombre"
               placeholder="Nombre" required />
      </div>

      <div class="form-field">
        <input type="text" class="form-control"
               [(ngModel)]="usuario.contrasena" name="contrasena"
               placeholder="Contrasena" required />
      </div>

      <div class="form-field">
        <input type="email" class="form-control"
               [(ngModel)]="usuario.email" name="email"
               placeholder="Email" required />
      </div>

      <div class="form-field">
        <input type="date" name="fechaInicio"
               [ngModel]="usuario.fecha_nacimiento | date:'yyyy-MM-dd'"
               (ngModelChange)="usuario.fecha_nacimiento = $event"
               class="form-control" />
      </div>

      <div class="form-field form-field--signo">
        <label class="form-label">{{ usuario.signo }}</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {{ editando ? 'Actualizar' : 'Agregar' }}
        </button>
        <button type="button" class="btn btn-secondary"
                *ngIf="editando" (click)="resetFormulario()">
          Cancelar
        </button>
      </div>

    </div>
  </form>

  <button (click)="metodo2()" [hidden]="true">Boton</button>

  <div class="table-wrapper">
    <table class="table table-bordered table-hover shadow-sm">
      <thead class="table-light">
        <tr>
          <th [hidden]="true">#</th>
          <th>Nombre</th>
          <th>Contraseña</th>
          <th>Email</th>
          <th>Fecha De Nacimiento</th>
          <th>Signo</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios; let i = index">
          <td [hidden]="true">{{ u.id }}</td>
          <td>{{ u.nombre }}</td>
          <td>{{ u.contrasena }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.fecha_nacimiento | date:'yyyy-MM-dd':'UTC' }}</td>
          <td>{{ u.signo }}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-warning me-2" (click)="editar(u)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(u.id!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

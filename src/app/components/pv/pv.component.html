<div class="container">
    <h2 class="titulo">Punto De Venta</h2>
  
    <!-- Formulario buscar producto -->
    <form (ngSubmit)="getProductoCodigo()" class="card">
      <div class="form-row">
        <div class="campo campo-codigo">
          <input type="text" class="input" [(ngModel)]="codigoB" name="codigo" placeholder="Codigo" required />
        </div>
        <div class="campo campo-cantidad">
          <input type="number" class="input" [(ngModel)]="cantidad" name="cantidad" placeholder="Cantidad" required />
        </div>
        <div class="campo campo-btn">
          <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
      </div>
    </form>
  
    <button (click)="metodo()" [hidden]="true">Boton</button>
  
    <!-- Tabla -->
    <div class="tabla-wrapper">
      <table class="tabla">
        <thead>
          <tr>
            <th>#</th>
            <th>Codigo</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of productos; let i = index">
            <td>{{ u.id }}</td>
            <td>{{ u.codigo }}</td>
            <td>{{ u.nombre }}</td>
            <td>{{ u.precio }}</td>
            <td>{{ cantidades[i] }}</td>
            <td>{{ totales[i] }}</td>
            <td class="col-acciones">
              <button class="btn btn-danger" (click)="eliminar(i)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <h5 class="total-linea">
      Total: <span class="color-azul">{{ Total }}</span>
      Cambio Es: <span class="color-verde">{{ Cambio }}</span>
    </h5>
  
    <!-- Formulario registrar -->
    <form (ngSubmit)="registrarVenta()" class="card">
      <div class="form-row">
        <div class="campo campo-pago">
          <input type="number" class="input" name="Pago" placeholder="Pago" (input)="onInputChange($event)" [(ngModel)]="Pago" required />
        </div>
        <div class="campo campo-btn">
          <button type="submit" class="btn btn-primary">Registrar</button>
        </div>
      </div>
    </form>
  </div>

<!-- Contenedor con Bootstrap -->
<div class="container mt-5">
    <h2 class="mb-4 text-center">Enviar Mensajes</h2>    

        <!-- Formulario para agregar o editar producto -->
        <form class="card p-4 shadow-sm mb-4">
        <div class="row g-3">

            <!-- Campo idemisor -->
            <div class="col-md-1">
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="idemisor"
                    name="idemisor"
                    placeholder="Emisor"
                    required
                />
            </div>
            <!-- Campo mensaje -->
            <div class="col-md-5">
                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="mensaje"
                    name="mensaje"
                    placeholder="Mensaje"
                    required
                />
            </div>
            <!-- Campo receptor -->
            <div class="col-md-1">
                <select (change)="capturarId($event)">
                    <option *ngFor="let usuario of usuarios" [value]="usuario.id">{{usuario.nombre}}</option>
                  </select>
            </div>

            <!-- Campo receptor -->
            <div class="col-md-1">
                <input
                    [readonly]="true"
                    type="text"
                    class="form-control"
                    [(ngModel)]="idreceptor"
                    name="idreceptor"
                    placeholder="Receptor"
                    required
                />
            </div>

            <!-- Buscar -->
            <div class="col-md-2 d-grid gap-2">
                <button  class="btn btn-primary" (click)="addChats()">Enviar Mensaje</button>
            </div>
            </div>
            <!-- Buscar -->
            <div class="col-md-2 d-grid gap-2">
                <button  class="btn btn-sm btn-warning me-2" (click)="getChatsNombres()">Actualizar</button>
            </div>
        </form>
        <!-- Tabla para mostrar mensajes -->
        <table class="table table-bordered table-hover shadow-sm">
            <thead class="table-light">
                <tr>
                <th>Mensaje</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let u of todosChats; let i = index">
                <td [ngClass]="{'mc1': idreceptor!=u.idr,'mc2': idreceptor==u.idr}">{{ u.mensaje }}</td>
                </tr>
            </tbody>
        </table>
</div>
